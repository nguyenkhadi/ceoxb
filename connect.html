<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO XB - Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="dashboard.html" class="logo">
                <img src="imgs/logo.png" alt="CEO XB">
            </a>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="learn.html">Learn</a>
                <a href="connect.html" aria-current="page">Connect</a>
                <a href="coffee.html">Coffee Chats</a>
                <a href="discuss.html">Discuss</a>
                <a href="profile.html">Profile</a>
                <a href="#" id="signout">Sign Out</a>
            </div>
        </nav>
    </header>

    <main class="dashboard">
        <section class="dashboard-header">
            <h1>Connect with Members</h1>
            <p>Get to know other CEOs in the community.</p>
        </section>

        <section class="connect-search">
            <label for="member-search">Find a member</label>
            <input type="search" id="member-search"
                   placeholder="Search by name, company, or location">
        </section>

        <section class="dashboard-section">
            <div class="section-heading">
                <h2>Member Directory</h2>
                <span id="member-count">0 members</span>
            </div>
        
            <div class="dashboard-grid" id="member-list"></div>
            <p id="no-search-results" class="learn-note" hidden>
                No matching members found.
            </p>
        
            <p id="no-members" class="learn-note" hidden></p>
        </section>
    </main>

    <footer><p>CEO XB</p></footer>
    <script src="script.js"></script>
</body>
</html>
