<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO XB - Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="design.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="imgs/logo.png" alt="CEO XB">
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#about">About</a>
                <a href="signin.html">Sign In</a>
                <a href="request-access.html" class="signup-btn">Request Access</a>
            </div>
        </nav>
    </header>

    <main class="signin-page">
        <section class="signin-box">
            <h1>Welcome Back</h1>
            <p>Sign in to your CEO XB account.</p>

            <form id="signin-form">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" required>

                <button type="submit" class="signin-button">Sign In</button>
                <p id="signin-message" class="signin-message" role="status"></p>
            </form>

            <div class="signin-footer-actions">
                <p class="signin-note">
                    CEO XB is a curated, invite-only community.
                </p>
                <p class="signin-apply-text">
                    Don't have an account?
                </p>   
                <a href="request-access.html" class="signin-apply-link">
                        Apply to Join <span aria-hidden="true">→</span>
                    </a>
                <a href="index.html" class="signin-back-link">
                    <span aria-hidden="true">←</span> Back to Home
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>CEO XB</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="theme.js"></script>
</body>
</html>
