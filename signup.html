<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEO XB - Sign Up</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="design.css">
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">
          <img src="imgs/logo.png" alt="CEO XB" />
        </a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="index.html#about">About</a>
          <a href="signin.html">Sign In</a>
          <a href="request-access.html" class="signup-btn">Request Access</a>
        </div>
      </nav>
    </header>
    <main class="signin-page">
      <section class="signin-box">
        <h1>Create your account</h1>
        <p>This page is for members who have already received an invitation.</p>
        <form id="signup-form">
          <label for="signup-name">Full name</label>
          <input id="signup-name" name="name" type="text" required />

          <label for="signup-email">Email address</label>
          <input id="signup-email" name="email" type="email" required />

          <label for="invite-code">Invitation code</label>
          <input id="invite-code" name="invite" type="text" required />

          <label for="signup-password">Password</label>
          <input
            id="signup-password"
            name="password"
            type="password"
            minlength="8"
            required
          />

          <label for="confirm-password">Confirm password</label>
          <input
            id="confirm-password"
            name="confirm"
            type="password"
            minlength="8"
            required
          />

          <button type="submit" class="signin-button">Create Account</button>
          <p id="signup-message" class="signin-message" role="status"></p>
        </form>
        <p class="signin-note">
          Need an invitation? <a href="request-access.html">Request access</a>
        </p>
        <p>Already have an account? <a href="signin.html">Sign In</a></p>
      </section>
    </main>
    <footer><p>CEO XB</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
  </body>
</html>
